[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellmodels"
version = "0.1.0"
description = "MSC confluency estimation from microscopy images using deep learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "torch",
    "scipy",
    "scikit-image",
]

[project.optional-dependencies]
dev = [
    "matplotlib",
    "tqdm",
    "mypy",
    "ruff",
    "black",
]
transfer = [
    "segmentation-models-pytorch",
]

[tool.setuptools.packages.find]
include = ["cellmodels*"]

[tool.setuptools.package-data]
cellmodels = ["weights/*.pt", "weights/*.json"]

[tool.mypy]
strict_equality = true
enable_error_code = ["possibly-undefined"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 88
target-version = ["py39"]
